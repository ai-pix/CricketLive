<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Center & Win Probability — Cricket Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

</head>
<body data-page="match">
  <main class="stage">
    <section class="page-frame theme-match">
      <header class="page-header">
        <div>
          <div class="page-kicker">LIVE MATCH CENTER</div>
          <h1 class="page-title" id="matchTitle">MATCH SUMMARY</h1>
        </div>
        <div class="live-score-pill">
          <span class="pill-team" id="pillTeam">BAN vs SA</span>
          <span class="pill-score" id="pillScore">0/0</span>
          <span class="pill-overs" id="pillOvers">OVERS 0.0</span>
        </div>
      </header>
      <div class="page-body">
        <div class="match-cards" id="matchCards"></div>
        <div class="glass-panel" style="flex:1; display:flex; flex-direction:column; justify-content:center;">
          <div class="page-kicker" style="margin-bottom:14px;">LIVE WIN PROBABILITY / MOMENTUM</div>
          <div class="win-bar-wrap" id="winWrap"></div>
        </div>
      </div>
    </section>
    <nav class="page-nav">
