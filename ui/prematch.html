<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pre-Match Show &amp; Countdown — Cricket Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body data-page="prematch">
  <main class="stage">
    <section class="page-frame theme-info">
      <header class="page-header">
        <div>
          <div class="page-kicker" id="prematchKicker">PRE-MATCH SHOW • 1ST SEMI FINAL • ASIA CUP RISING STARS 2026</div>

          <span class="pill-team" id="pillTeam">SL-A vs IND-A</span>
          <span class="pill-score" id="pillScore">PRE-MATCH</span>
          <span class="pill-overs" id="pillOvers">03:30 PM</span>
        </div>
      </header>
      <div class="page-body two-col">
        <div class="glass-panel" id="prematchHeroBox"></div>
        <div class="glass-panel" id="prematchBriefBox"></div>
      </div>
    </section>
    <nav class="page-nav"></nav>
  </main>
  <script src="pages.js?v=26"></script>
