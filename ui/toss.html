<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toss Center — Cricket Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="pages.css?v=27" />
</head>
<body data-page="toss">
  <main class="stage">
    <section class="page-frame theme-info">
      <header class="page-header">
        <div>
          <div class="page-kicker" id="tossKicker">COIN TOSS • 1ST SEMI FINAL • ASIA CUP RISING STARS 2026</div>
          <h1 class="page-title" id="tossTitle">TOSS CENTER &amp; PITCH DECISION</h1>
        </div>
        <div class="live-score-pill">
          <span class="pill-team" id="pillTeam">IND-A vs SL-A</span>
          <span class="pill-score" id="pillScore">TOSS 03:00 PM</span>
          <span class="pill-overs" id="pillOvers">DOHA</span>
        </div>
      </header>
      <div class="page-body two-col">
        <div class="glass-panel" id="tossHeroBox"></div>
        <div class="glass-panel" id="tossImpactBox"></div>
      </div>
    </section>
    <nav class="page-nav"></nav>
  </main>
  <script src="pages.js?v=27"></script>
</body>
</html>
