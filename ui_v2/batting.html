<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batting Scorecard — Cricket Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="pages.css?v=56" />
</head>
<body data-page="batting">
  <main class="stage">
    <section class="page-frame theme-batting">
      <header class="page-header">
        <div>
          <div class="page-kicker">INNINGS ANALYTICS</div>
          <h1 class="page-title">BATTING SCORECARD</h1>
        </div>
        <div class="live-score-pill">
          <span class="pill-team" id="pillTeam">NZ vs IND</span>
          <span class="pill-score" id="pillScore">246/5</span>
          <span class="pill-overs" id="pillOvers">OVERS 85.0</span>
        </div>
      </header>
      <div class="page-body">
        <div class="photo-split">
          <div class="photo-card" id="batHeroCard">
            <img src="/assets/batting_hero.jpg" alt="Batsman Action" />
            <div class="photo-card-overlay">
              <div class="photo-card-tag">ON STRIKE</div>
              <div class="photo-card-title" id="batHeroName">BATTER</div>
              <div class="photo-card-stat" id="batHeroStat">0 (0)</div>
            </div>
          </div>
          <div class="glass-panel" style="overflow:auto">
            <table class="pro-table" id="battingFullTable">
              <thead>
                <tr><th>BATTER</th><th>DISMISSAL</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
    <nav class="page-nav">
      <span class="nav-label">Broadcast Pages:</span>
      <a class="nav-link" href="/">Scoreboard</a>
      <a class="nav-link active" href="/batting.html">Batting</a>
      <a class="nav-link" href="/bowling.html">Bowling</a>
      <a class="nav-link" href="/overs.html">Overs &amp; FOW</a>
      <a class="nav-link" href="/match.html">Match &amp; Win%</a>
    </nav>
  </main>
  <script src="pages.js?v=56"></script>
</body>
</html>
