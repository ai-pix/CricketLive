<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live News Desk — Cricket Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="pages.css?v=56" />
</head>
<body data-page="news">
  <main class="stage">
    <section class="page-frame theme-info">
      <header class="page-header">
        <div>
          <div class="page-kicker">BREAKING CRICKET DESK • LIVE TOURNAMENT HEADLINES</div>
          <h1 class="page-title">LIVE NEWS &amp; STUDIO DISCUSSION</h1>
        </div>
        <div class="live-score-pill">
          <span class="pill-team" id="pillTeam">NZ vs IND</span>
          <span class="pill-score" id="pillScore">246/5</span>
          <span class="pill-overs" id="pillOvers">OVERS 85.0</span>
        </div>
      </header>
      <div class="page-body two-col">
        <div class="glass-panel" id="newsLeadBox"></div>
        <div class="glass-panel" id="newsFeedBox"></div>
      </div>
    </section>
    <nav class="page-nav"></nav>
  </main>
  <script src="pages.js?v=56"></script>
</body>
</html>
