<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scoring & Boundary Stats — Cricket Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="pages.css?v=56" />
</head>
<body data-page="runrate">
  <main class="stage">
    <section class="page-frame theme-overs">
      <header class="page-header">
        <div>
          <div class="page-kicker">DEEP ANALYTICS</div>
          <h1 class="page-title">BOUNDARIES &amp; SCORING</h1>
        </div>
        <div class="live-score-pill">
          <span class="pill-team" id="pillTeam">NZ vs IND</span>
          <span class="pill-score" id="pillScore">246/5</span>
          <span class="pill-overs" id="pillOvers">OVERS 85.0</span>
        </div>
      </header>
      <div class="page-body">
        <div class="match-cards" id="runrateCards"></div>
        <div class="glass-panel" style="flex:1; display:flex; flex-direction:column; justify-content:center;">
          <div class="page-kicker" style="margin-bottom:14px;">BOUNDARY VS RUNNING CONTRIBUTION</div>
          <div class="win-bar-wrap" id="boundarySplit"></div>
        </div>
      </div>
    </section>
    <nav class="page-nav"></nav>
  </main>
  <script src="pages.js?v=56"></script>
</body>
</html>
